name: Build Unsigned iOS IPA
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap init "Farmi Blast" com.farmiblast.game --web-dir www
          npx cap add ios
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CONFIGURATION_BUILD_DIR=build
          mkdir -p Payload
          cp -r ios/App/build/App.app Payload/
          zip -r Farmi-Blast.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Farmi-Blast-iOS-IPA
          path: Farmi-Blast.ipa
